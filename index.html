<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAFM Tickets Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--acbg:#e8efff;
--c-Completed:#16a34a;--c-Pending:#d97706;--c-Progress:#2563eb;--c-Fixed:#0d9488;--c-Remote:#7c3aed;--c-Closed:#6b7280;--c-Cancelled:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2c3340;--ac:#6ea0ff;--acbg:#22324f}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2c3340;--ac:#6ea0ff;--acbg:#22324f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.sub{color:var(--mu);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-inline-end:4px;animation:p 2s infinite}
.dot.bad{background:#dc2626;animation:none}
@keyframes p{50%{opacity:.3}}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;border-inline-start:4px solid var(--k,var(--ac))}
.kpi.on{background:var(--acbg);border-color:var(--k,var(--ac))}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--mu);font-size:12px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters input,.filters select{width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.bar .sp{flex:1}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-size:12px;color:var(--mu)}
th.s::after{content:attr(data-d);margin-inline-start:4px;color:var(--ac)}
tr:hover td{background:var(--acbg)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;background:var(--b,#6b7280)}
.tag{display:inline-block;padding:1px 7px;margin:1px;border-radius:6px;font-size:12px;background:var(--acbg);color:var(--ac);cursor:pointer}
a{color:var(--ac);text-decoration:none}
.id{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pg{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0}
.empty{padding:30px;text-align:center;color:var(--mu)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
.ch h3{font-size:13px;margin:0 0 8px;color:var(--mu)}
.hb{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}
.hl{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{flex:1;background:var(--bg);border-radius:4px;height:10px}
.ht i{display:block;height:100%;border-radius:4px}
.vbs{display:flex;align-items:flex-end;gap:4px;height:140px}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;min-width:0}
.vb i{width:100%;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.vb span{color:var(--mu);white-space:nowrap}
summary{cursor:pointer}
tr.od td{background:rgba(220,38,38,.08)}
.odb{display:inline-block;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.cards{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;border-inline-start:4px solid var(--b,#6b7280)}
.card.od{background:rgba(220,38,38,.08)}
.card .t{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .r{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px}
.card .r span:first-child{color:var(--mu)}
@media(max-width:700px){.tablebox{display:none}.cards{display:grid;gap:8px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📋 CAFM Tickets</h1><div class="sub" id="sub"></div></div>
  <button id="theme">🌓</button>
</header>
<div class="kpis" id="kpis"></div>
<div class="panel">
  <div class="filters">
    <input id="q" placeholder="🔍 بحث: رقم التذكرة / الفرع / التليفون / ملاحظات">
    <select id="fStatus"></select>
    <select id="fSegment"></select>
    <select id="fCountry"></select>
    <select id="fProject"></select>
    <select id="fVisitor"></select>
    <select id="fNote"></select>
    <label class="sub">من <input type="date" id="dFrom"></label>
    <label class="sub">إلى <input type="date" id="dTo"></label>
  </div>
  <div class="bar">
    <b id="count"></b>
    <label class="sub">متأخرة بعد <input type="number" id="odDays" min="1" value="7" style="width:64px"> يوم</label>
    <span class="sp"></span>
    <button id="refresh">🔄 تحديث البيانات</button>
    <button id="reset">إعادة ضبط</button>
    <button id="csv">⬇ تصدير CSV</button>
  </div>
</div>
<details class="panel" open><summary><b>📊 رسوم بيانية</b></summary><div class="charts" id="charts"></div></details>
<div class="cards" id="cards"></div>
<div class="tablebox"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="pg"><button id="prev">السابق ›</button><span id="pinfo"></span><button id="next">‹ التالي</button>
<select id="psize"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></div>
</div>
<script>(async()=>{
const $=id=>document.getElementById(id);
const REFRESH_MS=30000; // التحديث التلقائي كل 30 ثانية
$("body").innerHTML='<tr><td colspan="10" class="empty">جارٍ تحميل البيانات من Google Sheets...</td></tr>';
const SHEET_GVIZ_URL="https://docs.google.com/spreadsheets/d/1Dfx74MNE-aSh4TxMMoBkN9GLCsYpuIQGM32z0zy_fD0/gviz/tq?tqx=out:json";
function loadSheetJSONP(){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>finish(new Error("انتهت مهلة الاتصال بجدول Google Sheets")),20000);function finish(err,value){if(done)return;done=true;clearTimeout(timer);delete window.google;if(script.parentNode)script.parentNode.removeChild(script);err?reject(err):resolve(value)}const script=document.createElement("script");window.google={visualization:{Query:{setResponse:data=>finish(null,data)}}};script.src=SHEET_GVIZ_URL+"&_="+Date.now();script.onerror=()=>finish(new Error("تعذر الوصول إلى Google Sheets"));document.head.appendChild(script)});}
function cellValue(cell){let v=cell?.v??"";if(v instanceof Date){const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,"0"),d=String(v.getDate()).padStart(2,"0");return `${y}/${m}/${d}`}return String(v)}
const aliases=[["ticketid"],["branch"],["country"],["segment"],["phone"],["status"],["created"],["project"],["visitor / contacted","visitor","contacted"],["notes"]];
async function fetchRows(){
 const response=await loadSheetJSONP();
 if(response.status!=="ok"||!response.table)throw new Error("Google Sheets لم يُرجع بيانات صالحة");
 const parsed=[response.table.cols.map(c=>c.label||c.id||""),...response.table.rows.map(r=>(r.c||[]).map(cellValue))];
 const headers=(parsed.shift()||[]).map(x=>x.trim().toLowerCase());
 const indexes=aliases.map(names=>headers.findIndex(h=>names.includes(h)));
 if(indexes.some(i=>i<0))throw new Error("أسماء أعمدة الجدول لا تطابق الأعمدة المطلوبة");
 return parsed.filter(r=>r.some(v=>v.trim())).map(r=>indexes.map(i=>r[i]||"")).map(r=>({id:r[0],branch:r[1],country:r[2],segment:r[3],phone:r[4],status:r[5],created:r[6],project:r[7],visitor:r[8],notes:r[9],tags:r[9]?r[9].split(/\s*,\s*/).filter(Boolean):[]}));
}
const COLS=[["id","رقم التذكرة"],["branch","الفرع"],["country","المحافظة"],["segment","المنطقة"],["phone","التليفون"],["status","الحالة"],["created","التاريخ"],["project","المشروع"],["visitor","الزائر / المتصل"],["notes","ملاحظات"]];
const SC={"Completed":"--c-Completed","Pending Spare Parts":"--c-Pending","In Progress":"--c-Progress","Fixed":"--c-Fixed","Resolved Remotely":"--c-Remote","Closed":"--c-Closed","Cancelled":"--c-Cancelled"};
let rows=[],sig="",busy=false,lastOk=null,failed=false;
const st={sort:"created",dir:-1,page:0,status:"",overdue:false};
try{const v=localStorage.getItem("odDays");if(v)$("odDays").value=v}catch(e){}
const CLOSED=new Set(["Completed","Fixed","Closed","Cancelled","Resolved Remotely"]);
const ageDays=r=>{const m=/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(r.created||"");if(!m)return 0;return Math.max(0,Math.floor((Date.now()-new Date(+m[1],m[2]-1,+m[3]))/864e5))};
const limit=()=>Math.max(1,+$("odDays").value||7);
const isOver=r=>!CLOSED.has(r.status)&&ageDays(r)>limit();
const odBadge=r=>isOver(r)?` <span class="odb">⏱ ${ageDays(r)} يوم</span>`:"";
const phoneHTML=r=>r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> <a href="https://wa.me/2${esc(r.phone)}" target="_blank" rel="noopener">💬</a>`:"—";
function cardHTML(r){const c=`var(${SC[r.status]||"--c-Closed"})`;
 return `<div class="card ${isOver(r)?"od":""}" style="--b:${c}"><div class="t"><b>${esc(r.branch)||"—"}</b><span class="badge" style="--b:${c}">${esc(r.status)}</span></div>
 <div class="r"><span>رقم التذكرة</span><span class="id">${esc(r.id)}</span></div>
 <div class="r"><span>المحافظة / المنطقة</span><span>${esc(r.country)} / ${esc(r.segment)}</span></div>
 <div class="r"><span>التاريخ</span><span>${esc(r.created)}${odBadge(r)}</span></div>
 <div class="r"><span>المشروع</span><span>${esc(r.project)||"—"}</span></div>
 <div class="r"><span>الزائر</span><span>${esc(r.visitor)||"—"}</span></div>
 <div class="r"><span>التليفون</span><span>${phoneHTML(r)}</span></div>
 <div>${r.tags.map(t=>`<span class="tag" data-t="${esc(t)}">${esc(t)}</span>`).join("")}</div></div>`}
function drawCharts(list,base){
 const hb=items=>{const mx=Math.max(1,...items.map(i=>i[1]));return items.map(([l,n,c])=>`<div class="hb"><span class="hl" title="${esc(l)}">${esc(l)}</span><div class="ht"><i style="width:${n/mx*100}%;background:${c||"var(--ac)"}"></i></div><b>${n}</b></div>`).join("")||'<div class="sub">لا توجد بيانات</div>'};
 const top=(arr,n)=>Object.entries(arr.reduce((o,k)=>(k&&(o[k]=(o[k]||0)+1),o),{})).sort((a,b)=>b[1]-a[1]).slice(0,n);
 const stat=top(base.map(r=>r.status),12).map(([l,n])=>[l,n,`var(${SC[l]||"--c-Closed"})`]);
 const br=top(list.map(r=>r.branch),8);
 const mo=top(list.map(r=>(r.created||"").slice(0,7)).filter(x=>/^\d{4}[\/-]\d{2}$/.test(x)),999).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
 const mx=Math.max(1,...mo.map(m=>m[1]));
 $("charts").innerHTML=`<div class="ch"><h3>توزيع الحالات</h3>${hb(stat)}</div>
 <div class="ch"><h3>التذاكر شهريًا (آخر 12 شهر)</h3>${mo.length?`<div class="vbs">${mo.map(([m,n])=>`<div class="vb"><b>${n}</b><i style="height:${n/mx*100}%"></i><span>${m.slice(5)}/${m.slice(2,4)}</span></div>`).join("")}</div>`:'<div class="sub">لا توجد بيانات</div>'}</div>
 <div class="ch"><h3>أكثر الفروع تكرارًا للتذاكر</h3>${hb(br)}</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uniq=k=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));
function fill(id,label,vals){const s=$(id),cur=s.value;s.innerHTML=`<option value="">${label}: الكل</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("");if(vals.includes(cur))s.value=cur}
function buildFilters(){
 fill("fStatus","الحالة",uniq("status"));fill("fSegment","المنطقة",uniq("segment"));fill("fCountry","المحافظة",uniq("country"));
 fill("fProject","المشروع",uniq("project"));fill("fVisitor","الزائر",uniq("visitor"));
 fill("fNote","الملاحظة",[...new Set(rows.flatMap(r=>r.tags))].sort());
}
function setSub(){
 const dates=rows.map(r=>r.created).filter(Boolean).sort();
 const t=lastOk?lastOk.toLocaleTimeString("ar-EG"):"—";
 $("sub").innerHTML=`<span class="dot ${failed?"bad":""}"></span>${rows.length} تذكرة${dates.length?` • من ${dates[0]} إلى ${dates[dates.length-1]}`:""} • آخر تحديث ${t} • تلقائي كل ${REFRESH_MS/1000} ثانية${failed?" • ⚠ فشل آخر محاولة تحديث":""}`;
}
const fx=()=>({q:$("q").value.trim().toLowerCase(),status:$("fStatus").value,seg:$("fSegment").value,cty:$("fCountry").value,prj:$("fProject").value,vis:$("fVisitor").value,note:$("fNote").value,from:$("dFrom").value.replace(/-/g,"/"),to:$("dTo").value.replace(/-/g,"/")});
function filtered(skipStatus){const f=fx();return rows.filter(r=>
 (skipStatus||!f.status||r.status===f.status)&&(!f.seg||r.segment===f.seg)&&(!f.cty||r.country===f.cty)&&(!f.prj||r.project===f.prj)&&(!f.vis||r.visitor===f.vis)&&(!f.note||r.tags.includes(f.note))&&(!f.from||r.created>=f.from)&&(!f.to||r.created<=f.to)&&
 (!st.overdue||isOver(r))&&(!f.q||(r.id+r.branch+r.country+r.phone+r.notes+r.visitor).toLowerCase().includes(f.q)))}
function render(){
 const base=filtered(true),f=fx();
 const cnt={};base.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
 $("kpis").innerHTML=`<div class="kpi ${!f.status?"on":""}" data-s=""><b>${base.length}</b><span>الإجمالي</span></div><div class="kpi ${st.overdue?"on":""}" data-o="1" style="--k:#dc2626"><b>${base.filter(isOver).length}</b><span>⏱ متأخرة</span></div>`+
  Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(s=>`<div class="kpi ${f.status===s?"on":""}" data-s="${esc(s)}" style="--k:var(${SC[s]||"--c-Closed"})"><b>${cnt[s]}</b><span>${esc(s)} • ${Math.round(cnt[s]/base.length*100)}%</span></div>`).join("");
 let list=base.filter(r=>!f.status||r.status===f.status);
 const k=st.sort;list.sort((a,b)=>(a[k]||"").localeCompare(b[k]||"","ar")*st.dir||a.id.localeCompare(b.id)*-1);
 $("count").textContent=`${list.length} نتيجة`;
 const ps=+$("psize").value,pages=Math.max(1,Math.ceil(list.length/ps));st.page=Math.min(st.page,pages-1);
 $("head").innerHTML=COLS.map(([c,l])=>`<th data-c="${c}" class="${st.sort===c?"s":""}" data-d="${st.dir>0?"▲":"▼"}">${l}</th>`).join("");
 const pageRows=list.slice(st.page*ps,st.page*ps+ps);
 $("body").innerHTML=pageRows.length?pageRows.map(r=>`<tr class="${isOver(r)?"od":""}"><td class="id">${esc(r.id)}</td><td>${esc(r.branch)}</td><td>${esc(r.country)}</td><td>${esc(r.segment)}</td>
 <td>${r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> <a href="https://wa.me/2${esc(r.phone.replace(/^0/,"0"))}" target="_blank" rel="noopener" title="WhatsApp">💬</a>`:"—"}</td>
 <td><span class="badge" style="--b:var(${SC[r.status]||"--c-Closed"})">${esc(r.status)}</span></td><td>${esc(r.created)}${odBadge(r)}</td><td>${esc(r.project)||"—"}</td><td>${esc(r.visitor)||"—"}</td>
 <td>${r.tags.map(t=>`<span class="tag" data-t="${esc(t)}">${esc(t)}</span>`).join("")}</td></tr>`).join(""):`<tr><td colspan="10" class="empty">مفيش نتائج</td></tr>`;
 $("pinfo").textContent=`صفحة ${st.page+1} من ${pages}`;
 $("prev").disabled=st.page===0;$("next").disabled=st.page>=pages-1;
 $("cards").innerHTML=pageRows.length?pageRows.map(cardHTML).join(""):'<div class="empty">مفيش نتائج</div>';
 drawCharts(list,base);
 window._list=list;
}
// تحديث البيانات في الخلفية بدون إعادة تحميل الصفحة (الفلاتر والترتيب والصفحة الحالية بتفضل زي ما هي)
async function refresh(manual){
 if(busy)return;busy=true;const btn=$("refresh");if(manual)btn.textContent="⏳ جارٍ التحديث...";
 try{
  const nr=await fetchRows();lastOk=new Date();failed=false;
  const s=JSON.stringify(nr);
  if(s!==sig){sig=s;rows=nr;buildFilters();render()}
  setSub();
 }catch(err){
  console.error(err);failed=true;
  if(!rows.length){$("body").innerHTML='<tr><td colspan="10" class="empty">تعذر تحميل البيانات من Google Sheets. تحقق من اتصال الإنترنت وصلاحية مشاركة الجدول، وسيعاد المحاولة تلقائيًا.</td></tr>';$("count").textContent="فشل تحميل البيانات"}
  setSub();
 }finally{busy=false;btn.textContent="🔄 تحديث البيانات"}
}
const go=()=>{st.page=0;render()};
["q","fStatus","fSegment","fCountry","fProject","fVisitor","fNote","dFrom","dTo","psize"].forEach(i=>$(i).addEventListener("input",go));
$("kpis").onclick=e=>{const k=e.target.closest(".kpi");if(!k)return;if(k.dataset.o){st.overdue=!st.overdue}else{st.overdue=false;$("fStatus").value=k.dataset.s}go()};
$("head").onclick=e=>{const c=e.target.closest("th")?.dataset.c;if(!c)return;st.dir=st.sort===c?-st.dir:1;st.sort=c;render()};
$("body").onclick=e=>{const t=e.target.dataset.t;if(t){$("fNote").value=t;go()}};
$("cards").onclick=$("body").onclick;
$("odDays").addEventListener("input",()=>{try{localStorage.setItem("odDays",$("odDays").value)}catch(e){}go()});
$("prev").onclick=()=>{st.page--;render()};$("next").onclick=()=>{st.page++;render()};
$("refresh").onclick=()=>refresh(true);
$("reset").onclick=()=>{st.overdue=false;document.querySelectorAll(".filters input,.filters select").forEach(x=>x.value="");$("psize").value="50";go()};
$("csv").onclick=()=>{const q=v=>`"${String(v||"").replace(/"/g,'""')}"`;
 const t="\ufeff"+COLS.map(c=>q(c[1])).join(",")+"\n"+window._list.map(r=>COLS.map(c=>q(r[c[0]])).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="tickets_filtered.csv";a.click()};
$("theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#12151b";d.dataset.theme=dark?"light":"dark"};
await refresh();
setInterval(()=>{if(!document.hidden)refresh()},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
window.addEventListener("online",()=>refresh());
})();
</script>
</body>
</html>
